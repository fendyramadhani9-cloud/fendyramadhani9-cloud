<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="t-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090e1a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="t-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Animated Pulse -->
    <linearGradient id="t-pulse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <pattern id="t-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Container Box -->
  <rect width="900" height="420" rx="12" fill="url(#t-bg)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="900" height="420" rx="12" fill="url(#t-grid)" />

  <!-- Section Header -->
  <g class="sans">
    <text x="450" y="38" text-anchor="middle" font-size="16" font-weight="900" fill="url(#t-neon)" letter-spacing="3">
      T-SHAPED PLATFORM ENGINEERING PROFILE
    </text>
    <text x="450" y="58" text-anchor="middle" class="mono" font-size="11" fill="#64748b" letter-spacing="1">
      BROAD SYSTEM GENERALIST (HORIZONTAL) &times; DEEP INFRASTRUCTURE SPECIALIST (VERTICAL)
    </text>
  </g>

  <!-- ================= HORIZONTAL BAR (BROAD BREADTH) ================= -->
  <!-- Outer Horizontal Bar Glow Frame -->
  <rect x="30" y="80" width="840" height="74" rx="8" fill="#0b1329" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Breadth Domain Blocks -->
  <!-- Block 1: Linux & Shell -->
  <rect x="42" y="90" width="156" height="54" rx="6" fill="#070c18" stroke="#1e293b" />
  <text x="120" y="112" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#00f0ff">LINUX &amp; OS CORE</text>
  <text x="120" y="130" text-anchor="middle" class="mono" font-size="9" fill="#94a3b8">Kernel &bull; Bash &bull; Systemd</text>

  <!-- Block 2: Networking -->
  <rect x="208" y="90" width="156" height="54" rx="6" fill="#070c18" stroke="#1e293b" />
  <text x="286" y="112" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#38bdf8">NETWORKING &amp; EDGE</text>
  <text x="286" y="130" text-anchor="middle" class="mono" font-size="9" fill="#94a3b8">TCP/IP &bull; Cloudflare &bull; DNS</text>

  <!-- Block 3: Polyglot Dev -->
  <rect x="374" y="90" width="152" height="54" rx="6" fill="#070c18" stroke="#1e293b" />
  <text x="450" y="112" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#a855f7">POLYGLOT STACK</text>
  <text x="450" y="130" text-anchor="middle" class="mono" font-size="9" fill="#94a3b8">Python &bull; Go &bull; TypeScript</text>

  <!-- Block 4: Cloud & Security -->
  <rect x="536" y="90" width="156" height="54" rx="6" fill="#070c18" stroke="#1e293b" />
  <text x="614" y="112" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#f59e0b">CLOUD SERVICES</text>
  <text x="614" y="130" text-anchor="middle" class="mono" font-size="9" fill="#94a3b8">AWS &bull; IAM &bull; Edge Mesh</text>

  <!-- Block 5: Applied AI -->
  <rect x="702" y="90" width="156" height="54" rx="6" fill="#070c18" stroke="#1e293b" />
  <text x="780" y="112" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#10b981">INTELLIGENT AUTO</text>
  <text x="780" y="130" text-anchor="middle" class="mono" font-size="9" fill="#94a3b8">Gemini &bull; Ollama &bull; LLM Ops</text>

  <!-- ================= VERTICAL STEM (DEEP SPECIALIZATION) ================= -->
  <!-- Vertical Stem Spine Glow -->
  <rect x="270" y="154" width="360" height="246" rx="8" fill="#080e1e" stroke="#7000ff" stroke-width="1.5" stroke-opacity="0.8" />
  
  <!-- Animated Vertical Scanner Line -->
  <rect x="270" y="154" width="360" height="4" fill="url(#t-neon)" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 242" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- Deep Pillar 1: Infrastructure as Code -->
  <g transform="translate(285, 168)">
    <rect width="330" height="38" rx="6" fill="#060a15" stroke="#1e293b" />
    <circle cx="20" cy="19" r="5" fill="#00f0ff" />
    <text x="35" y="24" class="sans" font-size="12" font-weight="700" fill="#ffffff">Infrastructure as Code (IaC)</text>
    <text x="315" y="24" text-anchor="end" class="mono" font-size="10" fill="#00f0ff">Terraform &bull; State</text>
  </g>

  <!-- Deep Pillar 2: Containerization & Orchestration -->
  <g transform="translate(285, 214)">
    <rect width="330" height="38" rx="6" fill="#060a15" stroke="#1e293b" />
    <circle cx="20" cy="19" r="5" fill="#38bdf8" />
    <text x="35" y="24" class="sans" font-size="12" font-weight="700" fill="#ffffff">Container Orchestration</text>
    <text x="315" y="24" text-anchor="end" class="mono" font-size="10" fill="#38bdf8">Docker &bull; K8s &bull; K3s</text>
  </g>

  <!-- Deep Pillar 3: CI/CD & Platform Automation -->
  <g transform="translate(285, 260)">
    <rect width="330" height="38" rx="6" fill="#060a15" stroke="#1e293b" />
    <circle cx="20" cy="19" r="5" fill="#a855f7" />
    <text x="35" y="24" class="sans" font-size="12" font-weight="700" fill="#ffffff">CI/CD &amp; Delivery Pipelines</text>
    <text x="315" y="24" text-anchor="end" class="mono" font-size="10" fill="#a855f7">GitHub Actions</text>
  </g>

  <!-- Deep Pillar 4: Observability & SRE -->
  <g transform="translate(285, 306)">
    <rect width="330" height="38" rx="6" fill="#060a15" stroke="#1e293b" />
    <circle cx="20" cy="19" r="5" fill="#10b981" />
    <text x="35" y="24" class="sans" font-size="12" font-weight="700" fill="#ffffff">Full-Stack Observability</text>
    <text x="315" y="24" text-anchor="end" class="mono" font-size="10" fill="#10b981">Grafana &bull; Netdata</text>
  </g>

  <!-- Deep Pillar 5: Internal Developer Platform -->
  <g transform="translate(285, 352)">
    <rect width="330" height="38" rx="6" fill="#060a15" stroke="#1e293b" />
    <circle cx="20" cy="19" r="5" fill="#f43f5e" />
    <text x="35" y="24" class="sans" font-size="12" font-weight="700" fill="#ffffff">Internal Developer Platforms</text>
    <text x="315" y="24" text-anchor="end" class="mono" font-size="10" fill="#f43f5e">GitOps &bull; Auto-Scaling</text>
  </g>
</svg>
